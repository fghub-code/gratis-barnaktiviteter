name: Hämta och publicera

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 4 * * *'   # 06.00 svensk sommartid
  workflow_dispatch:

permissions:
  contents: write   # committa data/evenemang.json
  pages: write      # publicera till Pages
  id-token: write   # deploy-pages verifierar körningen

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  bygg:
    runs-on: ubuntu-latest
    # Körningen tar normalt under en minut. Taket är ett skyddsnät så att en
    # hängd körning inte blockerar i 24 timmar som den 2026-09-13.
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Hämta evenemang
        run: node hamta/index.mjs

      - name: Committa om något ändrats
        run: |
          git config user.name "hamtaren"
          git config user.email "actions@github.com"
          git add webb/data/evenemang.json
          git diff --staged --quiet || git commit -m "Uppdaterade evenemang $(date +%F)"
          git push

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: webb

      - id: deploy
        uses: actions/deploy-pages@v4
